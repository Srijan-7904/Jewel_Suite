# ==============================================================================
# Jewel Suite ERP & POS — Render Free-Tier Blueprint
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: jewel-suite-app
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm run render:build:all
    startCommand: npm run render:start:all
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_DATA_DIR
        value: /tmp/jewel-suite-data
      - key: DB_FILE_PATH
        value: /tmp/jewel-suite-data/jewel-suite.db
      - key: BACKUP_DIR
        value: /tmp/jewel-suite-data/backups
