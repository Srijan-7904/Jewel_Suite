# ==============================================================================
# Jewel Suite ERP & POS — Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# This blueprint defines two services:
# 1. jewel-suite-app: Unified Full-Stack Node.js Web Service (API + UI bundled)
#    with Persistent Disk for SQLite WAL database safety.
# 2. jewel-suite-frontend: (Optional) Standalone Static Site served via Render CDN.
#
# NOTE FOR FREE TIER USERS:
# Render disks require the 'starter' plan ($7/mo). If you want 100% free hosting,
# change 'plan: starter' to 'plan: free' and remove the 'disk:' block in service 1,
# or refer to RENDER.md for the free tier single-service configuration.
# ==============================================================================

services:
  # ============================================================================
  # 1. Full-Stack Web Service (Backend API + Embedded Frontend SPA)
  # ============================================================================
  - type: web
    name: jewel-suite-app
    runtime: node
    plan: starter
    region: oregon # Options: oregon, ohio, frankfurt, singapore
    rootDir: .
    buildCommand: npm run render:build:all
    startCommand: npm run render:start:all
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_DATA_DIR
        value: /var/data
      - key: DB_FILE_PATH
        value: /var/data/jewel-suite.db
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: jewel-data
      mountPath: /var/data
      sizeGB: 1

  # ============================================================================
  # 2. Dedicated Frontend Static Site (Optional CDN Deployment)
  # ============================================================================
  - type: web
    name: jewel-suite-frontend
    runtime: static
    rootDir: .
    buildCommand: npm run render:build:frontend
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jewel-suite-app.onrender.com
