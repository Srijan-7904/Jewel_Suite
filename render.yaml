# ==============================================================================
# Jewel Suite ERP & POS — Render Blueprint Specification (Single Full-Stack Service)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# This blueprint defines a single unified Web Service that builds and serves
# both the backend API and frontend React SPA on a single URL, saving service slots.
# ==============================================================================

services:
  - type: web
    name: jewel-suite-app
    runtime: node
    plan: starter # Starter plan ($7/mo) supports persistent disk. For 100% free tier, change plan to 'free' and remove the 'disk' block.
    region: oregon # Options: oregon, ohio, frankfurt, singapore
    rootDir: .
    buildCommand: npm run render:build:all
    startCommand: npm run render:start:all
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_DATA_DIR
        value: /var/data
      - key: DB_FILE_PATH
        value: /var/data/jewel-suite.db
      - key: BACKUP_DIR
        value: /var/data/backups
    disk:
      name: jewel-data
      mountPath: /var/data
      sizeGB: 1
